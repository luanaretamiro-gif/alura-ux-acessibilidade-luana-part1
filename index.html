<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Forca</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <main class="tela tela-inicial" id="tela-inicial">

        <div class="conteudo-inicial">

            <h1>A FORCA</h1>

            <p class="subtitulo">
                Um jogo de palavras para se divertir
            </p>

            <button class="botao-principal">
                JOGAR A FORCA
            </button>

            <button class="botao-secundario">
                COMO JOGAR
            </button>

        </div>

    </main>


    <!-- =========================
         TELA DE TEMAS
    ========================== -->

    <main class="tela tela-temas" id="tela-temas">

        <div class="cabecalho">
            <button class="botao-voltar">← VOLTAR</button>

            <h2>ESCOLHA UM TEMA</h2>

            <p>
                Escolha o assunto das palavras
            </p>
        </div>


        <div class="temas">

            <button class="tema">
                <span class="icone">🍎</span>
                <span>COMIDAS</span>
            </button>

            <button class="tema">
                <span class="icone">🐶</span>
                <span>ANIMAIS</span>
            </button>

            <button class="tema">
                <span class="icone">🌳</span>
                <span>NATUREZA</span>
            </button>

            <button class="tema">
                <span class="icone">🏠</span>
                <span>OBJETOS</span>
            </button>

            <button class="tema">
                <span class="icone">🚗</span>
                <span>VEÍCULOS</span>
            </button>

            <button class="tema">
                <span class="icone">👕</span>
                <span>ROUPAS</span>
            </button>

            <button class="tema">
                <span class="icone">🎵</span>
                <span>MÚSICA</span>
            </button>

            <button class="tema">
                <span class="icone">🌎</span>
                <span>LUGARES</span>
            </button>

        </div>

    </main>


    <!-- =========================
         TELA DO JOGO
    ========================== -->

    <main class="tela tela-jogo" id="tela-jogo">

        <header class="cabecalho-jogo">

            <button class="botao-voltar">
                ← TEMAS
            </button>

            <div class="informacoes">

                <span class="tema-atual">
                    🍎 COMIDAS
                </span>

                <span class="contador">
                    PALAVRA 1 DE 10
                </span>

            </div>

        </header>


        <section class="area-jogo">


            <!-- LETRAS USADAS -->

            <aside class="letras-usadas">

                <h3>LETRAS USADAS</h3>

                <div class="lista-letras">
                    <span>B</span>
                    <span>C</span>
                    <span>R</span>
                </div>

            </aside>


            <!-- DESENHO DA FORCA -->

            <div class="forca">

                <div class="estrutura-forca">

                    <div class="poste-vertical"></div>

                    <div class="poste-horizontal"></div>

                    <div class="suporte"></div>

                    <div class="corda"></div>

                </div>


                <!-- BONECO -->

                <div class="boneco">

                    <div class="cabeca"></div>

                    <div class="corpo"></div>

                    <div class="braco-esquerdo"></div>

                    <div class="braco-direito"></div>

                    <div class="perna-esquerda"></div>

                    <div class="perna-direita"></div>

                </div>

            </div>


            <!-- PALAVRA -->

            <div class="palavra">

                <span>_</span>
                <span>A</span>
                <span>_</span>
                <span>A</span>
                <span>_</span>
                <span>A</span>

            </div>


            <!-- TECLADO -->

            <section class="teclado">

                <div class="linha-teclado">

                    <button>A</button>
                    <button>B</button>
                    <button>C</button>
                    <button>D</button>
                    <button>E</button>
                    <button>F</button>
                    <button>G</button>

                </div>


                <div class="linha-teclado">

                    <button>H</button>
                    <button>I</button>
                    <button>J</button>
                    <button>K</button>
                    <button>L</button>
                    <button>M</button>
                    <button>N</button>

                </div>


                <div class="linha-teclado">

                    <button>O</button>
                    <button>P</button>
                    <button>Q</button>
                    <button>R</button>
                    <button>S</button>
                    <button>T</button>
                    <button>U</button>

                </div>


                <div class="linha-teclado">

                    <button>V</button>
                    <button>W</button>
                    <button>X</button>
                    <button>Y</button>
                    <button>Z</button>

                </div>

            </section>

        </section>

    </main>

</body>
</html>
